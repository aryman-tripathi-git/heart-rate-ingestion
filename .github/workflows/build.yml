name: Build Heart Rate CSV Importer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app

          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | grep -v "Xcode_26" | head -n 1)

          echo "Using Xcode: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Inspect project
        run: |
          xcodebuild -list -project HeartRateCSVImporter.xcodeproj

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project HeartRateCSVImporter.xcodeproj \
            -scheme HeartRateCSVImporter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/HeartRateCSVImporter.app \
            Payload/

          zip -r HeartRateCSVImporter-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeartRateCSVImporter-unsigned-ipa
          path: HeartRateCSVImporter-unsigned.ipa
